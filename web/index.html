<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>NLTodo</title>
  <style>
    :root {
      color-scheme: light dark;
      --fg: #1c1c1e;
      --muted: #6b6b70;
      --line: #d8d8dd;
      --code: #f2f2f5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --fg: #ececef;
        --muted: #9a9aa2;
        --line: #3a3a3e;
        --code: #26262a;
      }
    }
    html, body { margin: 0; padding: 0; }
    body {
      font: 13px/1.7 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--fg);
      padding: 18px 20px 22px;
      -webkit-font-smoothing: antialiased;
    }
    h1 { font-size: 15px; margin: 0 0 4px; font-weight: 600; }
    p.lead { margin: 0 0 16px; color: var(--muted); font-size: 12px; }
    table { border-collapse: collapse; width: 100%; }
    td { padding: 6px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
    tr:last-child td { border-bottom: 0; }
    td.syntax { width: 42%; white-space: nowrap; }
    code {
      font: 12px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace;
      background: var(--code);
      padding: 1px 5px;
      border-radius: 4px;
    }
    td.desc { color: var(--muted); font-size: 12px; }
    footer { margin-top: 16px; color: var(--muted); font-size: 11px; line-height: 1.6; }
  </style>
</head>
<body>
  <h1>NLTodo</h1>
  <p class="lead">在任意 Todo 正文里加一个时间标记，提醒由 PaperTodo 自己调度。</p>

  <table>
    <tr><td class="syntax"><code>@17today</code></td><td class="desc">今天 17:00</td></tr>
    <tr><td class="syntax"><code>@17tomorrow</code></td><td class="desc">明天 17:00</td></tr>
    <tr><td class="syntax"><code>@09:30tomorrow</code></td><td class="desc">明天 09:30</td></tr>
    <tr><td class="syntax"><code>@in25m</code></td><td class="desc">25 分钟后</td></tr>
    <tr><td class="syntax"><code>@in2h</code></td><td class="desc">2 小时后</td></tr>
    <tr><td class="syntax"><code>@in1d</code></td><td class="desc">24 小时后</td></tr>
    <tr><td class="syntax"><code>@2026-11-12T17:00</code></td><td class="desc">指定日期与时间</td></tr>
  </table>

  <footer>
    标记必须与正文用空格或标点隔开；一个 Todo 只允许一个时间标记。<br>
    修改标记会同步改提醒，删掉标记会撤销由 NLTodo 设置的提醒。<br>
    请不要删除名为“NLTodo”的隐藏纸片，它是后台运行的宿主。
  </footer>
</body>
</html>
